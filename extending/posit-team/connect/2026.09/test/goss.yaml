file:
  /opt/R/4.6.1/bin/R:
    exists: true
  /opt/python/3.14.7/bin/python:
    exists: true
  /opt/rstudio-connect/bin/connect:
    exists: true

command:
  "Verify R 4.6.1 reports the correct version":
    exec: /opt/R/4.6.1/bin/R --version
    exit-status: 0
    stdout:
      - "R version 4.6.1"
  "Verify shiny is installed for R 4.6.1":
    exec: /opt/R/4.6.1/bin/R -e 'library(shiny); cat(as.character(packageVersion("shiny")))'
    exit-status: 0
  "Verify Python 3.14.7 reports the correct version":
    exec: /opt/python/3.14.7/bin/python --version
    exit-status: 0
    stdout:
      - "3.14.7"
  "Verify pandas is installed for Python 3.14.7":
    exec: /opt/python/3.14.7/bin/python -c "import pandas; print(pandas.__version__)"
    exit-status: 0
