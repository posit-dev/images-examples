on:
  pull_request:

name: Examples - Extending
permissions: {}
jobs:

  collect-images:
    permissions:
      contents: read
    name: Collect image definitions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Collect directories with container files
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          # Plain extending examples: one entry per Containerfile or Dockerfile.
          # Skip directories with a bakery.yaml — those are handled by the
          # `bakery` job below via the shared bakery-build-pr workflow.
          entries=$(
              for dir in extending/*/; do
                  example_root=${dir%/}
                  [ -f "${example_root}/bakery.yaml" ] && continue
                  base=$(basename "$dir")
                  while IFS= read -r f; do
                      containerfile_dir=$(dirname "$f")
                      echo "${base},${containerfile_dir},$(basename "$f")"
                  done < <(find "$example_root" -type f \( -name "Containerfile*" -o -name "Dockerfile*" \))
              done | jq -R -s -c 'split("\n")[:-1] | map(split(",")) | map({name: .[0], directory: .[1], file: .[2]})'
          )

          # Create the matrix JSON in one step to avoid shell quoting issues
          matrix=$(echo "$entries" | jq -c '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  docker:
    permissions:
      contents: read
    needs:
      - collect-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.collect-images.outputs.matrix)}}
    name: Build with Docker - ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Check Docker Hub access
        id: docker-hub
        env:
          HAS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN != '' }}
        run: echo "available=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: steps.docker-hub.outputs.available == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: posit
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          push: false
          context: ${{ matrix.directory }}
          file: ${{ matrix.directory }}/${{ matrix.file }}

  bakery:
    name: Build with Bakery
    permissions:
      contents: read
      packages: write
    uses: posit-dev/images-shared/.github/workflows/bakery-build-pr.yml@main
    with:
      context: extending/posit-team
