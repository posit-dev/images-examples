on:
  pull_request:

name: Examples - Extending
permissions: {}
jobs:

  collect-images:
    permissions:
      contents: read
    name: Collect image definitions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Collect directories with container files
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          # Find directories under extending that contain Dockerfile or Containerfile
          entries=$(find extending -type f -name "Containerfile*" -o -name "Dockerfile*" | while read -r f; do
              dir=$(dirname "$f")
              name=$(basename "$dir")
              containerfile=$(basename "$f")
              echo "$name,$dir,$containerfile"
          done | jq -R -s -c 'split("\n")[:-1] | map(split(",")) | map({name: .[0], directory: .[1], file: .[2]})')

          # Create the matrix JSON in one step to avoid shell quoting issues
          matrix=$(echo "$entries" | jq -c '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  docker:
    permissions:
      contents: read
    needs:
      - collect-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.collect-images.outputs.matrix)}}
    name: Build with Docker - ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Check Docker Hub access
        id: docker-hub
        env:
          HAS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN != '' }}
        run: echo "available=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: steps.docker-hub.outputs.available == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: posit
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          push: false
          context: ${{ matrix.directory }}
          file: ${{ matrix.directory }}/${{ matrix.file }}
