on:
  pull_request:

name: Examples - Bakery
permissions: {}
jobs:

  collect-examples:
    permissions:
      contents: read
    name: Collect bakery examples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Collect numbered bakery directories
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          # Find numbered directories under bakery/ (e.g., 01-basic-image, 02-multiple-images)
          shopt -s nullglob
          entries=$(for dir in bakery/[0-9]*/; do
              name=$(basename "$dir")
              echo "$name"
          done | jq -R -s -c 'split("\n")[:-1] | map({name: .})')

          # Create the matrix JSON
          matrix=$(echo "$entries" | jq -c '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-test:
    permissions:
      contents: read
    needs:
      - collect-examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.collect-examples.outputs.matrix)}}
    name: Build and test - ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Check Docker Hub access
        id: docker-hub
        env:
          HAS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN != '' }}
        run: echo "available=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: steps.docker-hub.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: posit
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Goss
        uses: posit-dev/images-shared/setup-goss@main

      - name: Set up Bakery
        uses: posit-dev/images-shared/setup-bakery@main

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Add tools to PATH
        run: echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"

      - name: Build example
        env:
          EXAMPLE_NAME: ${{ matrix.name }}
        run: just --justfile bakery/Justfile build "$EXAMPLE_NAME"

      - name: Test example
        env:
          EXAMPLE_NAME: ${{ matrix.name }}
        run: just --justfile bakery/Justfile test "$EXAMPLE_NAME"

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054  # v0.6.2
